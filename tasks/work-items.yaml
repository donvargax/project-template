  - id: p2-project-generator
    title: Projects made by a generator, starting fresh
    phase: 2
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      A project made from the template inherits its history, its phases and its ledger, and has to
      set commits.since to step past them. A project should start fresh, so a generator that writes
      a new project from the template's current rules and tooling may replace the GitHub template.
      To be discussed before it is specified.

  - id: p2-node-types-follow-runtime
    title: "@types/node moving with .node-version"
    phase: 2
    owner: donvargax
    status: todo
    depends_on: [T-026]
    kind: idea
    why: >
      .node-version holds Node 24, and package.json's @types/node (^24) says the same major again,
      so a move to Node 26 that leaves the types behind type-checks against an API the runtime no
      longer matches. T-026 holds the line by leaving both still: Renovate's nodenv manager is off
      (enabledManagers) and @types/node's majors are disabled in .github/renovate.json5. The update
      bot should move both together, the file's major to the next LTS and the types with it, as one
      grouped update, or a check should hold the types' major to the file's.

  - id: p2-run-step-pins-updated
    title: The versions pinned inside run steps, moved by the update bot
    phase: 2
    owner: donvargax
    status: todo
    depends_on: [T-026]
    kind: idea
    why: >
      Renovate's github-actions manager moves a uses: pinned as <sha> # <version>, but two pins live
      inside run steps where it does not look: ci.yml's actionlint script, fetched from a commit and
      asked for 1.7.12, the two of which must move together, and nightly.yml's GitHub CLI, its
      GH_VERSION beside the release's GH_SHA256. T-027 adds a third outside its reach:
      tools/bin/vuln-scan's osv-scanner version and the four platforms' hashes beside it. Without
      a custom manager for each they stay where they were pinned while everything around them
      moves.

  - id: p2-update-release-age
    title: A release old enough before the update bot takes it
    phase: 2
    owner: donvargax
    status: todo
    depends_on: [T-026]
    kind: idea
    why: >
      Renovate lands an update on main as soon as CI is green on its branch, so a release published
      the hour before Monday's run, a hijacked one among them, is on main before anyone has had the
      time to pull it. A minimum release age (Renovate's minimumReleaseAge, or pnpm's own for every
      install) would make the bot wait some days after a release before it takes it.

  - id: p2-lockfile-maintenance
    title: The lockfile's transitive dependencies refreshed by the update bot
    phase: 2
    owner: donvargax
    status: todo
    depends_on: [T-026]
    kind: idea
    why: >
      Renovate moves what package.json and the catalog name, and the lockfile only as far as those
      moves need, so a transitive dependency stays at the version first locked until something
      above it moves. Its lock file maintenance, on the same weekly schedule and landed the same
      way, would re-resolve the whole lockfile, which T-027's scan would otherwise find stale.

  - id: p2-actionlint-binary-hash
    title: actionlint's binary checked against its release's hash
    phase: 2
    owner: donvargax
    status: todo
    depends_on: [T-025]
    kind: idea
    why: >
      T-025 fetches actionlint's install script from a commit, but the script then downloads the
      release tarball by its tag's URL and checks no hash, so the binary CI runs is still whatever
      the release asset is on the day. T-027's why takes actionlint as its model for a release
      checked against its published hash, which it is not; the nightly's GitHub CLI is. Installing
      actionlint the way the GitHub CLI is installed, from the tarball checked against the release's
      checksums file, would make both true.

  - id: p2-vuln-scan-negative-proof
    title: The vulnerability scan proven to report a finding
    phase: 2
    owner: donvargax
    status: todo
    depends_on: [T-027]
    kind: idea
    why: >
      T-027's check runs tools/bin/vuln-scan over the lockfile and passes because nothing is found
      today, which a scan that never reports would pass as well. A negative proof, the script
      failing over a small lockfile that locks a long-known vulnerable release (lodash 4.17.15,
      say), would show the scan still reports, after a move of osv-scanner or of its arguments.
      The script already hands a second --lockfile to osv-scanner; what is missing is the
      fixture, kept where the update bot and the project's own install leave it alone.

  - id: p2-no-mocks-other-libraries
    title: Mocking libraries other than vitest's refused too
    phase: 2
    owner: null
    status: todo
    depends_on: [T-030]
    kind: idea
    why: >
      code-design/no-mocks follows vitest's vi, the only way to mock the project has today. A
      project that adds sinon, testdouble or jest-mock, or imports @vitest/spy (what vi.fn is built
      on) directly, mocks past it. Refusing those imports in the same files, under the same
      mockBoundaries allowlist (no-restricted-imports in the rule's override, or the plugin's
      runners set grown into a list of mocking packages), would close it before the first one lands.

  - id: p2-control-regex-warning
    title: The control-character regex in the gates self-test, without a lint warning
    phase: 2
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Every vp check prints one warning, no-control-regex at tools/selftest/gates.ts, from the regex
      that strips ANSI colours from a hook's output. A warning every run reads as noise, so the next
      real one is missed. Pinning the hook's colour off (NO_COLOR, FORCE_COLOR=0) would make the
      regex unnecessary; failing that, a disable comment on the line saying why. Once it is gone,
      the code design self-test's whole-tree lint case (max-lines.ts) can forbid any warning, not
      only max-lines's, so the next rule at warn starts clean too.

