  - id: T-021
    title: itos 0.2.0
    phase: 1
    owner: donvargax
    status: done
    depends_on: [T-017]
    kind: task
    refs: [tasks/phase-1.yaml]
    why: >
      The pre-commit hook runs itos config check and itos work check when what they read is staged,
      because itos 0.1.0's hooks check neither; both read the working tree, not the index. itos
      0.2.0 checks them in its commit-msg hook, against what is staged, so the hook's copies go and
      the gates self-test's cases prove the release's hook instead.

  - id: T-022
    title: itos 0.4.0
    phase: 1
    owner: donvargax
    status: done
    depends_on: [T-021]
    kind: task
    refs: [tasks/phase-1.yaml]
    why: >
      With a header lint set, itos 0.2.0 runs only commitlint, so commitlint.config.ts carries the
      footer rules and asks itos commit check-message for them under a copy of the policy without
      the header lint. itos 0.4.0 runs its footer rules beside the header lint, so the plugin goes
      and commitlint keeps config-conventional alone.

  - id: p1-scenario-moves-in-itos
    title: The scenario moving rule, shipped by itos
    phase: 1
    owner: null
    status: todo
    depends_on: [T-014]
    kind: idea
    why: >
      tools/scenario-moves.ts is the project's own because the itos package ships its command line
      and not this rule. It reads each tree's scenario root from that tree's own itos.yaml, so a
      commit that moves the feature files with their root passes; itos's footer rules read the
      working tree's root instead, and find a moved commit's scenarios only by falling back to the
      working tree. If an itos release ships the rule as a built-in range check, the script goes.

  - id: p1-actionlint-at-commit
    title: actionlint where the commit-msg hook runs it
    phase: 1
    owner: null
    status: todo
    depends_on: [T-022]
    kind: idea
    why: >
      From itos 0.3.0 a commit naming T-008 or T-009, both done, runs actionlint in the commit-msg
      hook, and a session without it installed has that commit rejected. CI installs it, pinned;
      the README's first steps do not ask for it locally. Either they say so, or the check moves
      behind a command the project installs.

