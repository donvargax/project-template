  - id: p2-integration-tests
    title: Integration tests as a named kind, for the edge of each slice
    phase: 2
    owner: null
    status: todo
    depends_on: [T-031]
    kind: idea
    why: >
      Unit tests cover a slice's pure part and the scenarios the page, so the edge between them (the
      page, the network, storage) has no test of its own. Integration tests would be a named kind
      in itos.yaml (tests.integration), named by footers and run by CI like the scenarios, which
      needs an itos release that merges more than one kind in a CI run (itos's
      p1-several-test-kinds; v0.4.0 does not). Open when it is specified: the runner, where the
      files live, the ID pattern.

