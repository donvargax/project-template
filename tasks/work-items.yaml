      Coverage thresholds show the code ran, not that a test would notice it break, and agents
      write most of the tests. A mutation run over src/ (Stryker, say) in the nightly would find
      the tests that assert nothing. The owner has a follow-up on its shape before it is specified.

  - id: p2-project-generator
