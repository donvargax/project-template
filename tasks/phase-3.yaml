# Phase 3: code design learned downstream, from what character-editor (a
# project made from the template) met on 2026-10-01, mapped onto the
# template's own slices, lint plugin and self-tests. No scenario changes.

- id: T-032
  type: docs
  title: A task's checks prove this project, not itos
  why: >
    The ledger held checks that proved itos rather than this project:
    synthetic configs, ledgers and registries handed to itos config check,
    messages piped into itos commit check-message and the commit-msg hook,
    and itos verify over a made-up commit and over the whole history, whose
    range grew with every commit. They passed whatever the project held and
    could fail only on an itos regression, which itos's conformance suite
    proves in its own repository. They go from T-006, T-007, T-008, T-014 and
    T-022, each why saying so, and tasks/README.md's "What a check may be"
    states the rule. The path checks stay: itos commit check-paths over the
    project's own files holds its commits.scopes to the README's table. Prose
    and ledger only, so review is the proof.
  done_when: []

- id: T-033
  type: docs
  title: A rule over several states, written once and table-tested
  why: >
    In character-editor a rule over several boolean states ("is the drawing
    on screen?", over hidden, folded and popped) was written in a
    view-model and again in its template; the two drifted, and a combination
    nobody had decided was a bug. AGENTS.md's "Code design" asks for such a
    rule in one pure function or getter that the view and the logic both
    read, and for a unit test that drives every combination as a table, so
    every cell gets a decision. Lint cannot tell a rule restated from a rule
    read, so review is the proof.
  done_when: []

- id: T-034
  type: build
  title: A size tripwire on every linted file
  why: >
    character-editor's view-model grew to 920 lines over six slices, each
    adding behaviour where the related code already was, and no gate
    noticed. A lint warning, not an error, on a TypeScript file over 400
    lines, under src/, e2e/ and tools/ alike, is a prompt to look at the
    file's responsibilities; AGENTS.md's "Code design" names it so: the
    answer is a split by responsibility (under src/, into more features),
    never lines squeezed out to pass. It is a warning so that a file may
    stay long for a reason the next reader is told. The template starts
    with none, since a warning on every run is noise
    (p2-control-regex-warning): tools/selftest/code-design.ts, 552 lines
    when this was written, splits by the rule its cases prove. The
    self-test proves the warning lands on a file over the limit and not on
    one at it, that it does not fail lint, and that the template's own tree
    trips it nowhere, the case that fails before the split. It did: lint
    over the tree warned on the self-test, 498 lines of code in 552, and
    on nothing once its cases were split into a file per rule. Lines of
    code are counted, comments and blank lines aside, so the reasons a
    file gives never push it over, nor are cut to get it under.
  done_when:
    - run: vp check
    - run: node tools/selftest/code-design.ts

- id: T-035
  type: build
  title: A ratchet for adopting a code design rule on code that breaks it
  why: >
    A project made from the template inherits the code design rules clean;
    one that upgrades into them, or adopts a new one, has files that break
    it on the first day, and neither turning the rule off for them for good
    nor fixing them all in one commit is right. The ratchet lists those
    files by name, each with the rule it breaks and the work item in
    tasks/work-items.yaml for its fix; the rule is off for the listed files
    and on everywhere else, for lint's rules and the static check's alike.
    The list only shrinks: entries join only in the commit that brings
    their rule into force, and afterwards a file joining that rule's list is
    refused, at commit and in CI. An entry is refused too when its work item
    is missing or done, its file is gone, or its file no longer breaks the
    rule (it leaves the list, and its item closes). The list and
    mockBoundaries are the only ways a code design rule is turned off for a
    file: an oxlint-disable comment that names one (or disables every rule)
    is refused the same way, or the ratchet is bypassed in one line. Unlike
    vite.config.ts's mockBoundaries, a permanent exception that says which
    boundary it is, an entry is a debt with an owner. Empty in the template.
    The self-test proves each refusal and each allowance in a scratch tree,
    and AGENTS.md's "Code design" names the gate and says how a rule is
    adopted on existing code. How "in force" and "joining" are read across
    a pushed range is the implementer's to settle; the scenario moving
    rule's staged and range forms (tools/scenario-moves.ts) are a model.
    Settled so: code-design-ratchet.yaml names every rule the gates hold,
    so a rule is in force once any commit's list has named it, and an entry
    joins only with the commit that first names its rule; the joining rule
    is tools/code-design.ts's range form, which itos runs as a range check
    beside the moving rule (itos runs one only as a test kind's), in the
    commit-msg hook and in CI's verify. The check found that oxlint honours
    a directive in a line or a block comment, oxlint's or ESLint's
    spelling, but not in a JSDoc comment or in another case; the refusal
    reads all of them, by TypeScript's parser so a string is not a comment.
  done_when:
    - run: vp check
    - run: node tools/code-design.ts
    - run: node tools/selftest/code-design.ts

- id: T-036
  type: build
  title: "A slice's logic never touches the browser"
  why: >
    In character-editor a 920-line Aurelia view-model created and moved DOM
    elements itself (53 uses of browser globals), so it could not be
    unit-tested, and a rule it shared with its template drifted into a bug.
    Any framework leaks the same way, if less often where JSX or templates
    mediate the DOM: a hook, a composable or a store that reads storage or
    the viewport, listens on window or fetches. So code-design/no-browser
    refuses the browser's globals (window, document, navigator, location,
    history, the storages, indexedDB, fetch, XMLHttpRequest, WebSocket,
    addEventListener, open, innerWidth and innerHeight, getComputedStyle,
    matchMedia, requestAnimationFrame, the observers, and any of them
    reached through globalThis, self or window) in every file under src/,
    tests included, except the files vite.config.ts names in browserEdges:
    the browser lives at the project's edge, by name, as mockBoundaries
    names the files allowed to mock. The template's list is src/main.ts,
    the composition root, so the demo already passes; a project adds its
    framework's view files (src/**/*.tsx, src/**/*.vue) and its
    infrastructure slices, each wrapping one browser API behind a small
    interface the logic is handed and its tests hand a fake, as "No mocks"
    asks. A type names nothing at run time, so `HTMLElement` as a type
    passes, and a local binding that shadows a global is not the global.
    The clock stays outside (vitest's fake clock is its edge), and so do
    e2e/ and tools/, which drive a browser or run in Node. AGENTS.md's
    "Code design" says the browser is no longer a layer of the feature
    file, and where it goes; the ratchet (T-035) covers the rule, so a
    project upgrading into it lists its offending files. The self-test
    proves a logic file using document, window.localStorage or
    globalThis.fetch refused, naming the rule; a slice handed an adapter, a
    file in browserEdges, src/main.ts, a type-only use and a shadowing
    local allowed; and a file the ratchet lists allowed. Settled so: the
    rule is on for src/** whatever a file's kind, so a view file is held
    until browserEdges names it. The list took the other names of the same
    things (pageXOffset, scroll, scrollBy, cancelIdleCallback), screen,
    visualViewport and getSelection, and the DOM's classes as values (Node,
    Element, Document, Window, HTML*Element, SVG*Element, DOMParser, Image,
    Audio), since instanceof HTMLElement in logic needs the page as much as
    document does; what Node offers too (URL, Blob, crypto, structuredClone)
    stays out with the clock. oxlint resolves globalThis, ES's own, to a
    global it declares, so the rule reads those references beside the
    unresolved ones; globalThis and self handed on, or read by a computed
    key, pass, being the runtime's too.
  done_when:
    - run: vp check
    - run: node tools/selftest/code-design.ts

- id: T-037
  type: build
  title: itos 0.5.0
  why: >
    itos 0.5.0 adds a nightly step, { tasks: done }, that runs the checks of
    every done task, so a change elsewhere cannot break one unseen; names a
    failing check's task by its title; and reports a missing ledger folder
    and a shallow clone's missing commits.since as problems. The pin moves to
    the v0.5.0 tarball, checked against its SHA-256, and the release notes'
    "Upgrading" steps that apply here are made: requires ">=0.5.0"; anything
    that reads itos's output reads the new "CI failed at T-… (<title>), its
    check:" line; { tasks: done, cost: static } goes last in
    ci.nightly.steps, after the whole scenario run, and the nightly's job
    gets what those checks need (the whole history, actionlint), seen first
    by running the done tasks' static checks in a shallow clone with only
    the nightly's tools; a red one turns the nightly red and its issue names
    it. The notes' step 5 draws the line T-032 drew, a check proves this
    project and never itos, more narrowly: a message piped into itos commit
    check-message against the project's own itos.yaml checks its commit
    policy, and stays; only a synthetic config, ledger or registry, a
    recorded range, and the shape of a --json output test itos. So T-007
    gets back its checks that the project's policy rejects a build commit
    with no footer and a feat naming an unknown scenario, and accepts a
    docs commit naming a task, and tasks/README.md's paragraph says where
    the line is; the self-tests that read itos's --json output are kept only
    where they prove this project's plan. Done so. Nothing here read the old
    failure line: the nightly's red issue read only Playwright's failed
    scenarios, and now quotes ci run's "CI failed at" lines too, so a red
    task check reads as itself. In a shallow clone with only the nightly's
    tools the done tasks' static checks were red only on actionlint (T-008,
    T-009, T-023, T-025), which the nightly now installs as ci.yml does;
    config check passed there because the template sets no commits.since,
    but a project made from it sets one, so the nightly fetches the whole
    history. Running the late self-tests the move reaches found e2e-scope red
    since T-031 put the code design self-test in the nightly, unseen because
    no push named T-005, T-014, T-015 or T-020; it now asks what the nightly
    must run, not for the whole list. By the line, the scope self-tests keep
    the prose paths, the smoke, named and merged runs against Playwright's
    listing, the nightly running every scenario and the gates self-test, the
    named tasks' checks merged, covered, left to the nightly or run as the
    config says, and no browser step called static; they drop an empty range
    not being prose, an unread range run whole and the count of vp build
    among the steps, which could fail only if itos changed. The notes' step
    3 does not apply: the smoke set is not empty, so a smoke-selected check
    always joins a run. Of the known issues, p1-nightly-past-first-failure
    does (stop_at_first_failure is true), hence the step last; a range start
    beyond a shallow clone is met by ci.yml's fetch-depth: 0, and the
    nightly reads no range; the patterns spell out tools/bin/itos; the
    ledger's pattern does not reach the registry; nothing passes --data-at.
  done_when:
    - run: tools/bin/itos version --check
      cost: static
    - run: tools/bin/itos config check
    - run: vp install --frozen-lockfile
    - run: actionlint
    - run: tools/bin/itos task T-007
    - run: >-
        u=$(node -p 'require("./package.json").devDependencies.itos') &&
        d=$(mktemp -d) && cd "$d" && curl -fsSLO "$u" &&
        curl -fsSLO "${u%/*}/checksums.txt" && sha256sum -c checksums.txt

- id: T-038
  type: ci
  title: The workflows' actions on the Node 24 runtime
  why: >
    GitHub deprecated the Node 20 runtime for actions and forces the actions
    that still target it onto Node 24, warning on every run: CI's and the
    nightly's latest runs on 2026-10-03 named actions/checkout v4.4.0, and
    actions/upload-artifact v4.6.2 targets Node 20 too. A forced action runs
    on a runtime it was never released for, and stops running when GitHub
    removes Node 20. Nothing moves them while Renovate does not run here
    (T-039), so they move by hand to their current majors (v7.0.1 for both on
    that day), pinned to the commit with the tag beside it as T-025 has it,
    their release notes' breaking changes met in the workflows.
    voidzero-dev/setup-vp v1.21.0 already targets node24. The check resolves
    every action the workflows use at the commit they pin, through GitHub's
    API, and fails on one whose action.yml targets a Node runtime older than
    24, so the next deprecation is caught the same way.
  done_when:
    - run: actionlint
    - run: node tools/action-runtimes.ts

- id: T-039
  type: ci
  title: Renovate run from the repository's own workflow
  why: >
    T-026 configured Renovate for its hosted app, which needs an account
    with Mend, the app installed on the repository and a Dependency
    Dashboard issue; the owner wants none of the three (2026-10-03).
    Renovate is open source and runs as well from a workflow here:
    .github/workflows/renovate.yml runs renovatebot/github-action, pinned to
    a commit as T-025 has it, on a schedule and by hand
    (workflow_dispatch), never on a push or a pull request. A self-hosted
    Renovate lands a branch only when it runs again and finds the branch's
    CI green, so the schedule runs often enough after the weekly window
    for an update to land the same day, the window itself staying in
    .github/renovate.json5. The token is a fine-grained personal access
    token of the owner's, limited to this repository, in the secret
    RENOVATE_TOKEN (contents, workflows, pull requests and issues read and
    write; commit statuses and checks read): GITHUB_TOKEN will not do,
    because a push made with it starts no workflow, so CI would never run
    on renovate/** and nothing would land, and it cannot be given the
    workflows permission the actions' updates need. The config turns the
    Dependency Dashboard and onboarding off, so Renovate opens no issue
    and no pull request unless CI goes red on a branch. Majors keep landing
    on green CI as T-026 has them: the owner chose it on 2026-10-03, over
    int128's practice (github.com/int128/renovate-base) of holding majors
    for a human unless a package is on an allowlist.
  done_when:
    - run: npx --yes --package renovate -- renovate-config-validator --strict
    - run: actionlint
    - run: >-
        gh run list --workflow renovate.yml --branch main --limit 1
        --json conclusion --jq '.[0].conclusion == "success"' | grep -qx true
      after: push
