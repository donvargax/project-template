# itos.yaml — the task tooling's policy (tasks/README.md explains it)
#
# One file for every table the task tool reads: the ledger's layout, the
# commit rules, the named tests, the CI plan, the work routing and the hooks.
# itos (the release package.json pins, run by tools/bin/itos) loads it and
# rejects a key it does not know; `ITOS_CONFIG` names another file. `$name` in
# a path list stands for `commits.path_sets.<name>`. The range, the identity
# and the people are providers.
version: 1
requires: ">=0.4.0" # the oldest itos that runs the footer rules beside commitlint
shell: [sh, -c]

ledger:
  files: "tasks/phase-{group}.yaml" # one file per phase
  group: { label: phase, pattern: "\\d+", numeric: true }
  id: "T-\\d+"
  check:
    timeout: 600 # seconds

commits:
  types: [feat, fix, refactor, perf, test, build, ci, chore, docs, style, revert]
  header_lint: # commitlint, config-conventional alone: itos runs the footer rules after it
    hook: "vp exec commitlint --edit {file}"
    stdin: "vp exec commitlint"
  footers: # itos runs them itself, in the commit-msg hook, check-message and verify
    Task:
      source: ledger
      # A revert names the task it undoes, so a failed piece of work leaves a trail.
      required_for: [refactor, perf, test, build, ci, chore, revert]
      validate_for: all
      read_at: commit # a commit is judged against the ledger it carried
    Scenarios:
      source: { tests: scenario }
      strip_prefix: "@"
      required_for: [feat, fix]
      validate_for: [feat, fix]
      must_be_live: true # a feat or fix names scenarios it turns green, not @wip ones
      read_at: commit
  path_sets:
    config: # what build and ci commits may touch
      - "*.{json,yaml,yml,ts,toml}"
      - .gitignore
      - .editorconfig
      - .node-version # the Node version, read by Vite+ and by setup-vp in CI
      - ".vite-hooks/**"
      - ".github/**"
      - "tools/**"
      - .claude/settings.json
      - index.html
      - src/main.ts
  scopes: # the paths each commit type may touch (tasks/README.md's table)
    feat: { must_touch: ["src/**", "e2e/**", "features/**"] }
    fix: { must_touch: ["src/**"] }
    refactor: { never: ["features/**"] }
    perf: { never: ["features/**"] }
    test: { only: ["features/**", "e2e/**", "**/*.test.ts", "tools/**", playwright.config.ts] }
    build: { only: [$config] }
    ci: { only: [$config] }
    chore: { never: ["src/**"] }
    docs: { only: ["**/*.md", "docs/**", "tasks/**", "features/**/*.feature"] }
    style: {}
  reject_message: "Commit rejected (see tasks/README.md):"

tests: # named tests, each kind behind an adapter
  scenario:
    adapter: gherkin # built into itos
    root: features # the specification, at the root; its Playwright harness is e2e/
    id: "ID-[A-Z]+-\\d+"
    tag_prefix: "@"
    wip_tag: "@wip"
    run: # the one command every selection of a push merges into
      whole: "vp run e2e"
      select: "vp run e2e --grep {pattern}"
      ids_pattern: "@(?:{ids})\\b"
      join: { each: "(?:{p})", sep: "|" }
    recognize: # a task check read back as a selection, so CI runs it in the one run
      - { command: "vp run e2e", as: whole }
      - { command: "vp run e2e --grep {pattern}", as: pattern }
      - { command: "tools/bin/itos tests smoke run scenario", as: smoke }
    smoke:
      { file: features/smoke.yaml, every_file: true, add_hint: "add one to features/smoke.yaml" }
    range_checks:
      # Outside feat and fix, live scenarios only move, unchanged. The project's
      # own script: the itos package does not ship the rule.
      - name: scenario-moves
        except_types: [feat, fix]
        staged: "node tools/scenario-moves.ts --type {type}"
        range: "node tools/scenario-moves.ts {from} {to}"
      # The code design ratchet's joining rule, for every type: a file joins a
      # rule's list in code-design-ratchet.yaml only in the commit that brings
      # the rule into force. Not the scenarios' own rule: it rides here because
      # itos runs a range check only as a test kind's, in the commit-msg hook
      # and in verify, where a commit made without the hooks is judged too.
      - name: code-design-ratchet
        staged: "node tools/code-design.ts --staged"
        range: "node tools/code-design.ts {from} {to}"

ci:
  env: { CI: "1" }
  steps: # every step of CI, in order; each states its cost
    - { run: vp check, cost: static }
    # The code design rules lint cannot hold; a step, not a task check, so every push runs it.
    - { run: node tools/code-design.ts, cost: static }
    - { run: tools/bin/itos tests smoke check scenario, cost: static }
    - { run: tools/bin/itos config check, cost: static } # the config, the ledger, the registry, the smoke set
    - { run: vp run test:coverage, cost: late }
    - { run: vp build, cost: late }
    - { run: vp run audit, cost: late }
    - { run: tools/bin/itos task T-007, cost: late } # the commit rules, proven on every push
    - { tests: scenario } # the one merged run; late, as no pattern matches it
  prose: # a range that touches only these runs only the prose steps
    # The work registry is routing, not code: a push that only takes or closes
    # an item stays a prose push, and the config check validates the registry.
    paths: ["**/*.md", "docs/**", tasks/work-items.yaml]
    # The code design check too: closing a work item the ratchet still lists
    # is a registry change alone.
    steps: [vp check, node tools/code-design.ts, tools/bin/itos config check]
  cost:
    # Checks with no `cost:` of their own: static if a pattern matches, else
    # late. Only commands static by what they are: `sh -c` wraps anything, so a
    # static sh -c check says `cost: static` in the ledger.
    static:
      - "^vp check$"
      - "^(tools/bin/)?itos (tests smoke check|commit|verify|ci (plan|scope|range)|work|config check)\\b"
      - "^actionlint\\b"
      - "^git ls-remote "
      - "\\| vp exec commitlint$"
      - "^node tools/selftest/ci-scope\\.ts$"
    keep_written_order: true # a task's checks never run before the ones above them
  covers: # a check a step has just done is not run again
    - { by: "vp run test:coverage", matches: "^vp test run(?: [^\\s-]\\S*)*$" }
  # Slow, and it proves the gates rather than the code: left to the nightly.
  nightly_only: ["node tools/selftest/gates.ts"]
  # The code design self-test runs here too, so a vite-plus release that leaves
  # the lint plugin loaded but silent shows the next morning; it is fast, so a
  # push naming a task that checks it still runs it (not nightly_only).
  nightly:
    steps:
      [
        { tests: scenario, whole: true },
        node tools/selftest/gates.ts,
        node tools/selftest/code-design.ts,
      ]
  wait_on_status: [todo] # a named task nobody has started waits
  stop_at_first_failure: true
  range:
    provider: github # or command (with command:, its stdout) or none
    github:
      {
        workflow: ci.yml,
        branch: main,
        repository_env: GITHUB_REPOSITORY,
        token_env: [GITHUB_TOKEN, GH_TOKEN],
      }

work:
  groups_key: phases
  statuses: [todo, doing, done, blocked]
  # or all-contributorsrc (contributors[].login) or yaml (a list of logins)
  people:
    { source: all-contributors-md, file: CONTRIBUTORS.md, login_from: "https://github.com/{login}" }
  # gh api user; or command (with command:, its stdout) or none (only --as)
  identity: { provider: github, hint: "pass --as <handle>" }

hooks:
  manager: vp # shims in .vite-hooks/, written by `itos hooks install`
  bin: tools/bin/itos # what the shims call
  pre_push: { per_base: "vp test run --changed {base}", whole: "vp test run" }
