name: Nightly

# The whole E2E suite. A push's CI runs the smoke set and the scenarios and
# task subsets its commits name; every scenario runs here, once a night on
# main, or by hand from the Actions tab; then the gates self-test, which a
# push's CI leaves to the nightly, the code design self-test, which a push
# runs only when it names a task that checks it, and the static checks of
# every done task, which a push runs only for the tasks it names
# (itos.yaml's `ci.nightly`). Then the vulnerability scan of the lockfile, whatever the suite's result. A red run
# opens one issue, "Nightly red", or comments on the open one; a green run
# closes it. A push's CI opens nothing.
on:
  schedule:
    - cron: "44 11 * * *" # 11:44 UTC every day
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the Nightly red issue

# A group of its own: the nightly never cancels a push's run, nor is cancelled
# by one. A second nightly waits for the first.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the done tasks' checks read history: itos config check reads commits.since
          # No step after this one fetches or pushes, so the token is not left on
          # disk for the dependency install's scripts to find.
          persist-credentials: false
      # The itos launcher on the PATH, as ci.yml installs it.
      - uses: donvargax/itos@58f7e3f430eec46da415929cd46d2f2ecef46af0 # v6.5.1
        with:
          version: 6.5.1 # the action installs the newest release for a ref that is not a tag
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version # the one place the Node version is written
          cache: true
      - run: vp install
      - run: vp exec playwright install --with-deps chromium
      # actionlint, for the done tasks' checks that lint the workflows: the
      # runners don't carry it. Installed as ci.yml installs it: pinned, from
      # its own release script, fetched from v1.7.12's commit rather than the tag.
      - name: actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The output is kept for the issue below: the `✘` lines are the failing
      # scenarios, and a `CI failed at` line names the step or the task check
      # that failed. pipefail, so tee does not hide the run's exit code, which
      # the issue reads too: 1 a failing step or check, 75 a failure that may
      # pass when run again (a release server or GitHub's API out of reach),
      # 70 an error itos cannot classify, 3 a missing environment (the pinned
      # release not fetched or not matching its hash), 2 a usage or config
      # error.
      - name: Nightly
        id: nightly
        run: |
          set +e -o pipefail
          itos ci run --nightly 2>&1 | tee "$RUNNER_TEMP/nightly.log"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      # The dependencies' known vulnerabilities: pnpm-lock.yaml scanned by
      # tools/bin/vuln-scan, the script a contributor runs, which installs its
      # pinned osv-scanner checked against the release's SHA-256. A new
      # advisory appears overnight with no commit, so the scan is here rather
      # than in a push's CI. It runs after the suite and the self-tests, so a
      # red scan stops none of them, and whatever their result, so a red suite
      # hides no advisory; a red scan turns the run red. The output is kept
      # for the issue below.
      - name: Vulnerability scan
        id: vuln-scan
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          tools/bin/vuln-scan 2>&1 | tee "$RUNNER_TEMP/vuln-scan.log"
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      # The GitHub CLI, for the issue steps below. Pinned, from its release
      # tarball, checked against the release's SHA-256, so the runner image's
      # own copy, whatever its version, does not decide what runs. It runs
      # whatever the nightly's result.
      - name: GitHub CLI
        if: always()
        env:
          GH_VERSION: 2.101.0
          GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tgz="$RUNNER_TEMP/gh.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          mv "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$RUNNER_TEMP/bin/gh"
          rm -rf "$tgz" "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gh" --version
      # Red: one open issue labelled nightly-red, opened by the first red run
      # and commented on by every later one, with the failing scenarios, the
      # failing step or task check (itos's `CI failed at` line: `CI failed at:
      # <step> (it exited <code>)` for a step's, `CI failed at T-… (<title>),
      # its check: <command>` for a task's), what the vulnerability scan found,
      # and the run's URL. With neither saved from a red nightly step, the
      # issue says why by itos's exit code: one to retry (75), an itos bug to
      # report (70), a missing environment (3) or a usage or config error (2);
      # with no code, it failed before itos ran. The label is created on the
      # first red run.
      - name: Open or comment on the Nightly red issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NIGHTLY: ${{ steps.nightly.outcome }}
          NIGHTLY_CODE: ${{ steps.nightly.outputs.code }}
          VULN_SCAN: ${{ steps.vuln-scan.outcome }}
        run: |
          log="$RUNNER_TEMP/nightly.log"
          scan_log="$RUNNER_TEMP/vuln-scan.log"
          body="$RUNNER_TEMP/nightly-red.md"
          failing=""
          failed_at=""
          if [ -f "$log" ]; then
            failing=$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$log" | grep -F -- '✘' || true)
            failed_at=$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$log" | grep -E '^CI failed at ' || true)
          fi
          {
            echo "Nightly run $RUN_URL is red."
            if [ -n "$failing" ]; then
              echo
              echo "Failing scenarios:"
              echo
              echo '```'
              echo "$failing"
              echo '```'
            fi
            if [ -n "$failed_at" ]; then
              echo
              echo "Where the nightly stopped:"
              echo
              echo '```'
              echo "$failed_at"
              echo '```'
            fi
            if [ "$NIGHTLY" != success ] && [ -z "$failing" ] && [ -z "$failed_at" ]; then
              echo
              case "$NIGHTLY_CODE" in
                75) echo "itos exited 75: a release server or GitHub's API could not be reached or failed, so the nightly may pass when run again unchanged. See the run's log." ;;
                70) echo "itos exited 70: an error it cannot classify, a bug in itos to report on donvargax/itos with the run's log." ;;
                3) echo "itos exited 3: a missing environment, such as the release itos.yaml pins not fetched or not matching its hash. See the run's log." ;;
                2) echo "itos exited 2: a usage or config error. See the run's log." ;;
                "") echo "No failing scenario and no failing step or task check in the nightly's output: it failed before itos ran. See the run's log." ;;
                *) echo "itos exited $NIGHTLY_CODE with no failing scenario and no failing step or task check in its output. See the run's log." ;;
              esac
            fi
            if [ "$VULN_SCAN" = failure ]; then
              echo
              echo "The vulnerability scan (\`tools/bin/vuln-scan\`) is red: a known vulnerability in pnpm-lock.yaml, or the scanner could not run."
              echo
              echo '```'
              if [ -f "$scan_log" ]; then
                # An issue body holds 65536 characters; the run's log has all of it.
                sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$scan_log" | head -c 50000
              fi
              echo '```'
            fi
          } > "$body"
          gh label create nightly-red --description "The nightly run is red" --color B60205 2>/dev/null || true
          open=$(gh issue list --label nightly-red --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Commenting on issue #$open"
            gh issue comment "$open" --body-file "$body"
          else
            gh issue create --title "Nightly red" --label nightly-red --body-file "$body"
          fi
      # Green: close the open nightly-red issue, naming this run; with none
      # open, nothing.
      - name: Close the Nightly red issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --label nightly-red --state open --json number --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            echo "No open nightly-red issue"
            exit 0
          fi
          gh issue close "$open" --comment "Nightly run $RUN_URL is green."
